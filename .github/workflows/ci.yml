name: CI

# Slim CI: builds/tests only what's actually needed for this PR -- the changed nodes
# (state:modified, diffed against the manifest published by publish-dbt-state.yml), their
# ancestors, and their descendants (+state:modified+). No --defer: this project's CI Postgres is
# destroyed and recreated on every single job, so a deferred node's *data* (not just the manifest
# describing where it lives) would have to survive across separate ephemeral containers, which it
# can't -- confirmed in practice, not just in theory, the first time a PR left something genuinely
# unmodified that a new model still depended on. Including ancestors (+state:modified) instead
# means every node this run actually needs gets built fresh, right here, from the real loaded
# data, with no cross-run persistence assumption at all. In a real deployment with a persistent
# prod warehouse, --defer against it would be the correct, faster version of this -- see
# CLAUDE.md's parked production-grade work for that path.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DBT_HOST: db
  # Username stays "admin" -- raw_data/load_data.sh hardcodes -U admin and is off-limits to edit,
  # so the CI Postgres instance's username can't be parameterized independently of it. Only the
  # password is a real secret; the container is destroyed at the end of every job regardless.
  PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
  CI_POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: python:3.11-slim
    services:
      db:
        image: postgres:latest
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        options: >-
          --health-cmd "pg_isready -U admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # git must exist before actions/checkout runs: the container image (python:3.11-slim)
      # has no git preinstalled, and without it actions/checkout silently falls back to
      # downloading the repo via the GitHub REST API instead of a real `git clone` -- which
      # leaves no .git directory at all. Every later git command (ours, and pre-commit's
      # internal ones) then fails with a generic "are you in a git repository?" error that looks
      # identical to a dubious-ownership problem but isn't -- there's simply no repo yet.
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git

      - uses: actions/checkout@v4

      - name: Mark workspace as a safe git directory
        # Belt-and-suspenders: container jobs can also check the repo out under a different UID
        # than git runs as inside the container, which git treats as "dubious ownership" and
        # refuses to touch (CVE-2022-24765 hardening). Cheap to set even if checkout already
        # handles it.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install remaining system + Python dependencies
        run: |
          apt-get install -y --no-install-recommends postgresql-client
          pip install --no-cache-dir -r requirements.txt

      - name: Load raw data
        # Reuses init.sql + raw_data/load_data.sh completely unmodified -- these are the exact
        # same scripts used locally, off-limits to edit. load_data.sh already waits for Postgres
        # itself, so no separate readiness step is needed here. PGPASSWORD comes from the
        # workflow-level env above.
        run: |
          psql -h db -U admin -d postgres -f init.sql
          bash raw_data/load_data.sh

      - name: dbt deps
        run: dbt deps

      - name: Lint + contribution checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Fetch reference state (last known-good main build)
        id: fetch_state
        continue-on-error: true
        run: |
          git fetch origin dbt-ci-state
          mkdir -p prod-state
          git show origin/dbt-ci-state:manifest.json > prod-state/manifest.json

      - name: dbt build -- changed models, their ancestors, and their descendants
        # Scoped to package:enpal_assessment_project -- dbt_project_evaluator's own models show
        # as "modified" against an identical reference manifest on every single parse (a package
        # quirk, verified present even before this selector existed; unrelated to our project's
        # state). Without the scope, CI would build the entire audit suite on every PR, which
        # dbt_project_evaluator is explicitly meant to run on demand only, not routinely.
        if: steps.fetch_state.outcome == 'success'
        run: >
          dbt build --target ci
          --select "+state:modified+,package:enpal_assessment_project"
          --state ./prod-state

      - name: dbt build -- full (no reference state published yet)
        if: steps.fetch_state.outcome != 'success'
        run: dbt build --target ci
