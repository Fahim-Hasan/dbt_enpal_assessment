name: Publish dbt state

# Runs a full build on every merge to main (our closest stand-in for "production" -- there is no
# separate persistent prod warehouse in this project) and publishes the resulting manifest.json
# to a dedicated orphan branch (dbt-ci-state). ci.yml reads that branch on every PR to defer
# unchanged upstream models against real prod-equivalent state instead of rebuilding them or
# leaving them stale.

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  DBT_HOST: db
  # Username stays "admin" -- raw_data/load_data.sh hardcodes -U admin and is off-limits to edit,
  # so the CI Postgres instance's username can't be parameterized independently of it. Only the
  # password is a real secret; the container is destroyed at the end of every job regardless.
  PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
  CI_POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}

jobs:
  build-and-publish-state:
    runs-on: ubuntu-latest
    container: python:3.11-slim
    services:
      db:
        image: postgres:latest
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        options: >-
          --health-cmd "pg_isready -U admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install system + Python dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends postgresql-client git
          pip install --no-cache-dir -r requirements.txt

      - name: Mark workspace as a safe git directory
        # Same fix as ci.yml -- container jobs check the repo out with a different UID than the
        # one git runs as inside the container ("dubious ownership", CVE-2022-24765 hardening).
        # This job does git checkout --orphan/push below, which needs it too.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Load raw data
        # PGPASSWORD comes from the workflow-level env above.
        run: |
          psql -h db -U admin -d postgres -f init.sql
          bash raw_data/load_data.sh

      - name: dbt deps
        run: dbt deps

      - name: dbt build -- full
        run: dbt build --target ci

      - name: Publish manifest.json as the new reference state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp target/manifest.json /tmp/manifest.json
          git checkout --orphan dbt-ci-state-new
          git reset --hard
          cp /tmp/manifest.json manifest.json
          git add manifest.json
          git commit -m "dbt state as of ${GITHUB_SHA::7}"
          git push origin dbt-ci-state-new:dbt-ci-state --force
