version: 2

models:
  - name: int_deals_funnel_unioned
    description: >
      One row represents one deal reaching one funnel step (a pipeline stage, or an activity-
      derived sub-step) at one point in time. Raw union of int_pipedrive__deal_stage_events and
      int_pipedrive__activity -- no validity filtering here (see fct_deals__funnel for that).
    data_tests:
      - no_invalid_substep_events:
          config:
            severity: warn
  - name: int_pipedrive__deal_stage_events
    description: >
      One row represents one deal reaching one pipeline stage at one point in time. Complete,
      unfiltered passthrough of stg_pipedrive__deal_changes where changed_field_key='STAGE_ID' --
      deliberately does NOT exclude the 5 known deal_id collisions or check sub-step consistency;
      that's a mart-level concern (see fct_deals__funnel / macros/get_invalid_substep_events.sql).
    columns:
      - name: deal_id
        description: >
          Deal identifier. Not unique in this table (a deal reaches multiple stages over time,
          and can legitimately regress to an earlier stage -- normal Pipedrive behavior).
        data_tests:
          - not_null
      - name: funnel_step
        description: Stage reached, resolved via get_funnel_step_from_code from the raw stage_id. Values '1'-'9'.
        data_tests:
          - not_null
      - name: event_date
        description: Timestamp the deal reached this stage.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - deal_id
              - funnel_step
              - event_date
  - name: int_pipedrive__activity
    description: >
      One row represents one candidate sub-step (Sales Call 1/2) activity -- done meetings/sc_2
      activities from stg_pipedrive__activity, resolved to funnel_step '2.1'/'3.1' via
      get_funnel_step_from_code. Unfiltered for deal-linkage reliability here; that check lives
      in fct_deals__funnel (macros/get_invalid_substep_events.sql), since activity.deal_id has no
      verified relationship to the deal_changes deal population.
    columns:
      - name: deal_id
        description: Intended FK to a deal -- not reliably linked to deal_changes, see model description.
        data_tests:
          - not_null
      - name: funnel_step
        description: Sub-step code, '2.1' (Sales Call 1) or '3.1' (Sales Call 2).
        data_tests:
          - not_null
      - name: event_date
        description: The activity's due/occurrence timestamp.
        data_tests:
          - not_null
