version: 2

models:
  - name: rep_sales_funnel_monthly
    description: >
      One row represents one funnel step's deal count for one month. Required reporting model
      per the assessment brief -- exactly month/kpi_name/funnel_step/deals_count. Fully dense:
      every funnel step appears in every month across the observed date range (dim_dates x
      dim_deals__funnel_steps), zero-filled via coalesce -- including 2.1/3.1, which read 0 in
      every month (see fct_deals__funnel for why). This is stronger zero-fill than the semantic
      layer's `mf query` can produce: MetricFlow's time spine only densifies the time axis, not
      funnel_step, so a step with 0 deals in an otherwise-active month is omitted from `mf query`
      output but shown here as an explicit 0 row -- the two are not expected to return identical
      row counts for the same month.
    columns:
      - name: month
        description: First day of the calendar month. Part of the grain.
        data_tests:
          - not_null
      - name: kpi_name
        description: Business label for the step, from dim_deals__funnel_steps.
        data_tests:
          - not_null
      - name: funnel_step
        description: Ordinal step code (e.g. '1', '2.1'). Part of the grain.
        data_tests:
          - not_null
      - name: deals_count
        description: Distinct count of deals reaching this funnel step in this month. 0 is valid, not missing data.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - month
              - funnel_step
