services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./raw_data:/raw_data  # Mount raw_data folder to access CSV files
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  data_loader:
    image: postgres:latest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./raw_data:/raw_data
    entrypoint: /bin/bash /raw_data/load_data.sh
    environment:
      PGPASSWORD: admin
    links:
      - db

  dbt:
    build: .
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/usr/app
    environment:
      DBT_HOST: db  # profiles.yml falls back to localhost when this isn't set (host workflow)
    links:
      - db
