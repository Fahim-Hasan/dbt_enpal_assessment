enpal_assessment_project:
  outputs:
    dev:
      dbname: postgres
      # Defaults to localhost for the host-machine/pip workflow (README setup); the `dbt`
      # docker-compose service overrides this to `db` (the Postgres service name) since it
      # reaches Postgres over the compose network, not localhost.
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      pass: admin
      port: "{{ env_var('DBT_PORT', '5432') | as_number }}"
      schema: public
      threads: 4
      type: postgres
      user: admin

    # CI runs inside a GitHub Actions job `container:`, where service containers are reachable
    # by service name (not localhost) -- see .github/workflows/. Isolated `ci` base schema keeps
    # CI builds visibly separate from `dev`, even though each CI run already gets a fresh,
    # ephemeral Postgres instance with nothing else in it.
    ci:
      dbname: postgres
      host: db
      # No default here (unlike dev's hardcoded local-only password) -- CI_POSTGRES_PASSWORD is
      # supplied via a GitHub Actions secret, set as a job-level env var in .github/workflows/.
      pass: "{{ env_var('CI_POSTGRES_PASSWORD') }}"
      port: 5432
      schema: ci
      # 1, not 4 like dev: this project's intermediate layer is all views, and concurrent
      # CREATE OR REPLACE VIEW statements can contend for AccessExclusiveLock on Postgres's
      # pg_rewrite catalog (class 2618) -- observed directly as real deadlocks in this exact
      # multi-threaded scenario, and the likely cause of a wrong-row-count test flake that could
      # not be reproduced with the same code run single-threaded. Every build measured this
      # session completes in 1-3 seconds regardless of thread count, so trading concurrency for
      # determinism here is effectively free.
      threads: 1
      type: postgres
      user: admin
  target: dev
